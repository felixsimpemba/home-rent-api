      responses:
        '200':
          description: KYC request rejected

  /admin/audit-logs:
    get:
      summary: Fetch audit logs of administration actions
      tags: [Admin & Moderation]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'

  /admin/settings:
    get:
      summary: Retrieve global platform settings
      tags: [Admin & Moderation]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'
    put:
      summary: Update global system settings configuration
      tags: [Admin & Moderation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemSettings'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'

  # =========================================================================
  # 12. ANALYTICS & MONITORING (5 endpoints)
  # =========================================================================
  /analytics/properties/{id}:
    get:
      summary: Fetch detailed visitor/interaction analytics for a specific listing
      tags: [Analytics]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyAnalytics'

  /analytics/landlord/dashboard:
    get:
      summary: Fetch metrics dashboard for landlord (views, inquiry conversions)
      tags: [Analytics]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandlordDashboard'

  /analytics/platform/overview:
    get:
      summary: Get general growth analytics for admin
      tags: [Analytics]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_listings:
                    type: integer
                  active_users:
                    type: integer
                  rented_rate:
                    type: number

  /analytics/platform/revenue:
    get:
      summary: Get platform revenue analysis parameters (Admin only)
      tags: [Analytics]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  monthly_revenue:
                    type: number
                  total_subscriptions:
                    type: integer

  /analytics/pricing-trends:
    get:
      summary: Fetch average rental pricing trends in Zambia regions
      tags: [Analytics]
      security: []
      parameters:
        - name: province
          in: query
          schema:
            type: string
        - name: district
          in: query
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceTrendItem'

  # =========================================================================
  # 13. FILE UPLOADS (4 endpoints)
  # =========================================================================
  /uploads/presigned-url:
    post:
      summary: Generate a presigned URL to upload directly to S3 / Cloud Storage
      tags: [File Uploads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, content_type]
              properties:
                filename:
                  type: string
                content_type:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  upload_url:
                    type: string
                  file_url:
                    type: string

  /uploads/file:
    post:
      summary: Direct file upload multipart endpoint (alternative/fallback)
      tags: [File Uploads]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageMetadata'

  /uploads/my-files:
    get:
      summary: Get list of files uploaded by current user
      tags: [File Uploads]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImageMetadata'

  /uploads/{fileId}:
    delete:
      summary: Delete an uploaded file
      tags: [File Uploads]
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: File deleted

  # =========================================================================
  # 14. SEARCH INDEXING (5 endpoints)
  # =========================================================================
  /search-index/reindex:
    post:
      summary: Trigger search indexing sync process (Admin only)
      tags: [Search Indexing]
      responses:
        '202':
          description: Reindexing process scheduled successfully

  /search-index/status:
    get:
      summary: Retrieve Elasticsearch/MeiliSearch engine cluster status (Admin only)
      tags: [Search Indexing]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  engine:
                    type: string
                  status:
                    type: string
                  documents_indexed:
                    type: integer

  /search-index/synonyms:
    get:
      summary: List search synonym mappings
      tags: [Search Indexing]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SynonymRule'
    post:
      summary: Add a new search synonym rule (Admin only)
      tags: [Search Indexing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SynonymRule'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SynonymRule'

  /search-index/synonyms/{id}:
    delete:
      summary: Remove a search synonym rule
      tags: [Search Indexing]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Synonym rule removed

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    QueryAuth:
      type: apiKey
      in: query
      name: token

  responses:
    ValidationError:
      description: Invalid request body or validation rules violated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Authentication token missing, expired, or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: User lacks roles/permissions to execute resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # --- Auth Schemas ---
    RegisterRequest:
      type: object
      required: [first_name, last_name, email, phone, password, account_type]
      properties:
        first_name:
          type: string
          example: Felix
        last_name:
          type: string
          example: Simpemba
        email:
          type: string
          format: email
          example: felix@example.com
        phone:
          type: string
          pattern: '^\+260\d{9}$'
          example: "+260977123456"
        password:
          type: string
          minLength: 8
          example: Password@123
        account_type:
          type: string
          enum: [tenant, landlord, agent]
          example: tenant

    RegisterResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            user_id:
              type: string
            verification_required:
              type: boolean

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: felix@example.com
        password:
          type: string
          example: Password@123

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
        token:
          type: string
        refresh_token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8

    UserSession:
      type: object
      properties:
        id:
          type: string
        device_name:
          type: string
        ip_address:
          type: string
        last_active:
          type: string
          format: date-time

    # --- User Schemas ---
    User:
      type: object
      properties:
        id:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [tenant, landlord, agent, moderator, admin]

    UpdateUserRequest:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
        bio:
          type: string

    TenantProfile:
      type: object
      properties:
        user_id:
          type: string
        occupation:
          type: string
        nrc_number:
          type: string
        references:
          type: array
          items:
            type: string

    LandlordProfile:
      type: object
      properties:
        user_id:
          type: string
        company_name:
          type: string
        nrc_number:
          type: string
        verified:
          type: boolean

    AgentProfile:
      type: object
      properties:
        user_id:
          type: string
        agency_name:
          type: string
        license_number:
          type: string
        tax_number:
          type: string
        verified:
          type: boolean

    UserPreferences:
      type: object
      properties:
        email_notifications:
          type: boolean
        push_notifications:
          type: boolean
        preferred_provinces:
          type: array
          items:
            type: string

    # --- Property Schemas ---
    Property:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        property_type:
          type: string
        listing_type:
          type: string
        price:
          type: number
        deposit:
          type: number
        bedrooms:
          type: integer
        bathrooms:
          type: integer
        parking_spaces:
          type: integer
        province:
          type: string
        district:
          type: string
        area:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageMetadata'
        amenities:
          type: array
          items:
            type: string
        status:
          type: string
        owner:
          type: object
          properties:
            id:
              type: string
            name:
              type: string

    PropertyRequest:
      type: object
      required: [title, description, property_type, listing_type, price, province, district, area]
      properties:
        title:
          type: string
        description:
          type: string
        property_type:
          type: string
        listing_type:
          type: string
          enum: [rent, sale]
        price:
          type: number
        deposit:
          type: number
        bedrooms:
          type: integer
        bathrooms:
          type: integer
        parking_spaces:
          type: integer
        province:
          type: string
        district:
          type: string
        area:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        amenities:
          type: array
          items:
            type: string

    ImageMetadata:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        created_at:
          type: string
          format: date-time

    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string

    AvailabilityBlock:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        start_time:
          type: string
        end_time:
          type: string

    PropertyHistory:
      type: object
      properties:
        id:
          type: string
        event:
          type: string
        old_value:
          type: string
        new_value:
          type: string
          format: date-time

    # --- Inquiry & Viewing Schemas ---
    Inquiry:
      type: object
      properties:
        id:
          type: string
        property_id:
          type: string
        tenant_id:
          type: string
        message:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time

    InquiryRequest:
      type: object
      required: [property_id, message]
      properties:
        property_id:
          type: string
        message:
          type: string

    Viewing:
      type: object
      properties:
        id:
          type: string
        property_id:
          type: string
        tenant_id:
          type: string
        date:
          type: string
          format: date
        time:
          type: string
        message:
          type: string
        status:
          type: string

    ViewingRequest:
      type: object
      required: [property_id, date, time]
      properties:
        property_id:
          type: string
        date:
          type: string
          format: date
        time:
          type: string
        message:
          type: string

    # --- Booking & Lease Schemas ---
    Booking:
      type: object
      properties:
        id:
          type: string
        property_id:
          type: string
        tenant_id:
          type: string
        status:
          type: string
        created_at:
          type: string

    BookingRequest:
      type: object
      required: [property_id]
      properties:
        property_id:
          type: string

    Lease:
      type: object
      properties:
        id:
          type: string
        booking_id:
          type: string
        terms:
          type: string
        tenant_signed:
          type: boolean
        landlord_signed:
          type: boolean
        created_at:
          type: string

    LeaseRequest:
      type: object
      required: [booking_id, terms]
      properties:
        booking_id:
          type: string
        terms:
          type: string

    Screening:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        status:
          type: string
        report_url:
          type: string

    # --- Saved Search ---
    SavedSearch:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        filters:
          type: object

    # --- Payments ---
    MoMoPaymentRequest:
      type: object
      required: [provider, phone_number, amount]
      properties:
        provider:
          type: string
          enum: [mtn, airtel, zamtel]
        phone_number:
          type: string
          pattern: '^\+260\d{9}$'
          description: Zambia mobile number format.
        amount:
          type: number
          minimum: 1

    Transaction:
      type: object
      properties:
        id:
          type: string
        reference:
          type: string
        provider:
          type: string
        phone_number:
          type: string
        amount:
          type: number
        currency:
          type: string
          default: ZMW
        status:
          type: string
          enum: [pending, successful, failed]
        created_at:
          type: string
          format: date-time

    Refund:
      type: object
      properties:
        id:
          type: string
        transaction_id:
          type: string
        amount:
          type: number
        status:
          type: string
        reason:
          type: string

    RefundRequest:
      type: object
      required: [transaction_id, amount, reason]
      properties:
        transaction_id:
          type: string
        amount:
          type: number
        reason:
          type: string

    SubscriptionPlan:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
        features:
          type: array
          items:
            type: string

    Subscription:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        plan_id:
          type: string
        status:
          type: string
        ends_at:
          type: string
          format: date-time

    # --- WebSockets & Chat ---
    Conversation:
      type: object
      properties:
        id:
          type: string
        participants:
          type: array
          items:
            $ref: '#/components/schemas/User'
        last_message:
          $ref: '#/components/schemas/Message'
        updated_at:
          type: string
          format: date-time

    Message:
      type: object
      properties:
        id:
          type: string
        conversation_id:
          type: string
        sender_id:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        id:
          type: string
        recipient_id:
          type: string
        title:
          type: string
        body:
          type: string
        read:
          type: boolean
        created_at:
          type: string
          format: date-time

    # --- Property Compare ---
    ComparisonMatrix:
      type: object
      properties:
        properties:
          type: array
          items:
            $ref: '#/components/schemas/Property'
        differences:
          type: array
          items:
            type: string

    # --- Agent CRM ---
    CRMLead:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        pipeline_status:
          type: string
          enum: [inquiry, viewing_scheduled, lease_drafted, rented, closed]
        assigned_properties:
          type: array
          items:
            type: string

    CRMTask:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        due_date:
          type: string
          format: date-time
        done:
          type: boolean

    CRMMeeting:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        meeting_time:
          type: string
          format: date-time
        lead_id:
          type: string

    # --- Admin Moderation ---
    ContentReport:
      type: object
      properties:
        id:
          type: string
        reporter_id:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        reason:
          type: string
        status:
          type: string

    VerificationQueueItem:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        role:
          type: string
        document_urls:
          type: array
          items:
            type: string
        submitted_at:
          type: string
          format: date-time

    AuditLog:
      type: object
      properties:
        id:
          type: string
        actor_id:
          type: string
        action:
          type: string
        details:
          type: string
        timestamp:
          type: string
          format: date-time

    SystemSettings:
      type: object
      properties:
        maintenance_mode:
          type: boolean
        listing_moderation_required:
          type: boolean
        agent_subscription_price:
          type: number

    # --- Analytics ---
    PropertyAnalytics:
      type: object
      properties:
        views:
          type: integer
        inquiries_count:
          type: integer
        viewings_count:
          type: integer

    LandlordDashboard:
      type: object
      properties:
        active_listings:
          type: integer
        total_income:
          type: number
        occupancy_rate:
          type: number

    PriceTrendItem:
      type: object
      properties:
        region:
          type: string
        average_price:
          type: number
        year_month:
          type: string

    # --- Search Synonyms ---
    SynonymRule:
      type: object
      properties:
        id:
          type: string
        word:
          type: string
        synonyms:
          type: array
          items:
            type: string

    # --- Pagination & Errors ---
    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    ErrorResponse:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
          example: https://api.homerent.zm/errors/validation-failed
        title:
          type: string
          example: Validation Failed
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: The 'phone' field does not match the required Zambia format pattern.
        instance:
          type: string
          format: uri
          example: /api/v1/auth/register
        invalid_params:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: phone
              reason:
                type: string
                example: must be in format +2609XXXXXXXX
