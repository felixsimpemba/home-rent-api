openapi: 3.0.3
info:
  title: Home Rent API
  description: |
    Comprehensive production-grade REST and WebSocket API for Home Rent.
    Supports ~120 endpoints across authentication, user management, property listing/search,
    inquiries, viewings, booking management, mobile money payments (MTN, Airtel, Zamtel),
    agent CRM tools, admin moderation queues, analytics, file uploads, and search indexing.
  version: 1.0.0
servers:
  - url: https://api.homerent.zm/api/v1
    description: Production Server
  - url: http://localhost:8080/api/v1
    description: Local Development Server

security:
  - BearerAuth: []

paths:
  # =========================================================================
  # 1. AUTHENTICATION & SESSIONS (12 endpoints)
  # =========================================================================
  /auth/register:
    post:
      summary: Register a new user
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      summary: User login
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful, returns tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/logout:
    post:
      summary: Log out current user / invalidate session
      tags: [Authentication]
      responses:
        '200':
          description: Successfully logged out
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/refresh:
    post:
      summary: Refresh authentication token
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/forgot-password:
    post:
      summary: Request password reset link
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset password email sent successfully

  /auth/reset-password:
    post:
      summary: Reset password using verification token
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully

  /auth/verify-email:
    post:
      summary: Verify email address with token
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Email verified successfully

  /auth/mfa/enable:
    post:
      summary: Initialize multi-factor authentication (MFA)
      tags: [Authentication]
      responses:
        '200':
          description: MFA setup details, returns QR code secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                  qr_code_url:
                    type: string

  /auth/mfa/disable:
    post:
      summary: Disable multi-factor authentication (MFA)
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        '200':
          description: MFA disabled successfully

  /auth/mfa/verify:
    post:
      summary: Verify MFA code during login
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_token, code]
              properties:
                login_token:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: MFA verification successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /auth/sessions:
    get:
      summary: List all active user sessions
      tags: [Authentication]
      responses:
        '200':
          description: Active sessions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSession'

  /auth/sessions/{id}:
    delete:
      summary: Revoke an active session (logout specific device)
      tags: [Authentication]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session revoked successfully

  # =========================================================================
  # 2. USERS & PROFILES (13 endpoints)
  # =========================================================================
  /users/me:
    get:
      summary: Get details of current user
      tags: [Users]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    put:
      summary: Update profile of current user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      summary: Deactivate current user account
      tags: [Users]
      responses:
        '204':
          description: Account deactivated successfully

  /users/{id}:
    get:
      summary: Get user profile details by ID
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{id}/avatar:
    put:
      summary: Update user avatar image URL
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [avatar_url]
              properties:
                avatar_url:
                  type: string
      responses:
        '200':
          description: Avatar updated

  /tenants/{id}:
    get:
      summary: Get tenant KYC/profile details
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantProfile'
    put:
      summary: Update tenant profile/KYC metadata
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantProfile'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantProfile'

  /landlords/{id}:
    get:
      summary: Get landlord profile details
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandlordProfile'
    put:
      summary: Update landlord profile details
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LandlordProfile'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandlordProfile'

  /agents/{id}:
    get:
      summary: Get agent profile details
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfile'
    put:
      summary: Update agent credentials/company details
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentProfile'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProfile'

  /users/{id}/preferences:
    get:
      summary: Get user notification & search preferences
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
    put:
      summary: Update user search & notification preferences
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferences'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'

  # =========================================================================
  # 3. PROPERTIES & CALENDARS (20 endpoints)
  # =========================================================================
  /properties:
    get:
      summary: Search and filter property listings
      tags: [Properties]
      security: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: listing_type
          in: query
          schema:
            type: string
            enum: [rent, sale]
        - name: province
          in: query
          schema:
            type: string
        - name: area
          in: query
          schema:
            type: string
        - name: min_price
          in: query
          schema:
            type: number
        - name: max_price
          in: query
          schema:
            type: number
        - name: bedrooms
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Matched property list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Property'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
    post:
      summary: Create a new property listing
      tags: [Properties]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyRequest'
      responses:
        '201':
          description: Property listing created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'

  /properties/featured:
    get:
      summary: Get list of featured properties
      tags: [Properties]
      security: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Property'

  /properties/nearby:
    get:
      summary: Find properties nearby coordinates
      tags: [Properties]
      security: []
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
        - name: longitude
          in: query
          required: true
          schema:
            type: number
        - name: radius_km
          in: query
          schema:
            type: number
            default: 5
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Property'

  /properties/recommendations:
    get:
      summary: Get personalized property recommendations for current user
      tags: [Properties]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Property'

  /properties/categories:
    get:
      summary: List all property categories
      tags: [Properties]
      security: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      summary: Create a property category (Admin only)
      tags: [Properties]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'

  /properties/categories/{id}:
    put:
      summary: Update a property category (Admin only)
      tags: [Properties]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
    delete:
      summary: Delete a property category (Admin only)
      tags: [Properties]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Category deleted

  /properties/{id}:
    get:
      summary: Get property details by ID
      tags: [Properties]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
    put:
      summary: Update property listing details
      tags: [Properties]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
    delete:
      summary: Delete property listing
      tags: [Properties]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Property deleted

  /properties/{id}/status:
    patch:
      summary: Update property listing status
      tags: [Properties]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [draft, active, rented, archived]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'

  /properties/{id}/images:
    post:
      summary: Upload images for a property listing (Multipart)
      tags: [Properties]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  images:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImageMetadata'

  /properties/{id}/images/{imageId}:
    delete:
      summary: Delete a specific image from a property listing
      tags: [Properties]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: imageId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Image deleted

  /properties/{id}/availability:
    get:
      summary: Get calendar availability/viewings for property
      tags: [Properties]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailabilityBlock'
    post:
      summary: Define calendar availability blocks (Agents/Landlords)
      tags: [Properties]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityBlock'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityBlock'

  /properties/{id}/reports:
    post:
      summary: Submit a report about a listing (e.g. fraud, inaccurate details)
      tags: [Properties]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Listing report received successfully

  /properties/{id}/history:
    get:
      summary: Fetch pricing/status history of a property listing
      tags: [Properties]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PropertyHistory'

  /properties/{id}/amenities:
    post:
      summary: Add or update property listing amenities
      tags: [Properties]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amenities]
              properties:
                amenities:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Amenities updated

  # =========================================================================
  # 4. FAVORITES & SAVED SEARCHES (6 endpoints)
  # =========================================================================
  /favorites:
    get:
      summary: Get user favorited properties
      tags: [Favorites]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Property'
    post:
      summary: Add a property to favorites
      tags: [Favorites]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [property_id]
              properties:
                property_id:
                  type: string
      responses:
        '201':
          description: Added to favorites

  /favorites/{propertyId}:
    delete:
      summary: Remove a property from favorites
      tags: [Favorites]
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removed from favorites

  /saved-searches:
    get:
      summary: List user saved search filters
      tags: [Favorites]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedSearch'
    post:
      summary: Save a set of property search filters for notification alerts
      tags: [Favorites]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedSearch'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSearch'

  /saved-searches/{id}:
    delete:
      summary: Delete a saved search filter
      tags: [Favorites]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted successfully

  # =========================================================================
  # 5. INQUIRIES & VIEWINGS (12 endpoints)
  # =========================================================================
  /inquiries:
    get:
      summary: List property inquiries (sent/received)
      tags: [Inquiries]
      parameters:
        - name: property_id
          in: query
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Inquiry'
    post:
      summary: Create a property inquiry
      tags: [Inquiries]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InquiryRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inquiry'

  /inquiries/{id}:
    get:
      summary: Retrieve details of a specific inquiry
      tags: [Inquiries]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inquiry'

  /inquiries/{id}/close:
    patch:
      summary: Close/resolve an inquiry thread
      tags: [Inquiries]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inquiry'

  /inquiries/{id}/replies:
    post:
      summary: Post a reply within an inquiry thread
      tags: [Inquiries]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
      responses:
        '201':
          description: Reply sent successfully

  /viewings:
    get:
      summary: List viewing requests (received/sent)
      tags: [Viewings]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, rescheduled]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Viewing'
    post:
      summary: Request a property viewing slot
      tags: [Viewings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewingRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Viewing'

  /viewings/{id}:
    get:
      summary: Get viewing request details
      tags: [Viewings]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Viewing'

  /viewings/{id}/approve:
    patch:
      summary: Approve viewing request
      tags: [Viewings]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Viewing'

  /viewings/{id}/reject:
    patch:
      summary: Reject viewing request
      tags: [Viewings]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Viewing'

  /viewings/{id}/reschedule:
    patch:
      summary: Request rescheduling of a viewing
      tags: [Viewings]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
